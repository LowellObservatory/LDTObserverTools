[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "obstools"
dynamic = ["version"]
description = "Collection of Observer Tools for the Lowell Discovery Telescope"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.12,<3.15"
license = "MPL-2.0"
authors = [{name = "Timothy P. Ellsworth Bowers", email = "tbowers@lowell.edu"}]
keywords = ["obstools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "astropy>=7.2",
    "darkdetect",
    "ccdproc>=2.5.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "scipy>=1.16.2",
    "PySimpleGUI-4-foss",
    "pyqt6",
    "requests",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/LowellObservatory/LDTObserverTools"

[project.optional-dependencies]
docs = ["sphinx>=8.2.3", "sphinx-automodapi", "sphinx-subfigure", "sphinx_rtd_theme<4"]
broker = ["pyyaml", "stomp.py", "xmltodict"]
pypeit = ["pypeit[specutils]>=2.0"]
test = ["pytest>=8.4.2", "pytest-astropy", "tox"]
dev = [
    "sphinx>=8.2.3", "sphinx-automodapi", "sphinx-subfigure", "sphinx_rtd_theme<4",
    "pylint", "black", "pypeit[specutils]>=2.0; python_version < '3.14'", "pyyaml", "stomp.py",
    "xmltodict", "pytest>=8.4.2", "pytest-astropy", "tox",
]

[project.scripts]
deveny_grangle = "obstools.deveny_grangle:DevenyGrangle.entry_point"
deveny_collfocus = "obstools.deveny_collfocus:DevenyCollfocus.entry_point"
dfocus = "obstools.dfocus:DFocus.entry_point"
fix_ldt_header = "obstools.fix_ldt_header:FixLdtHeader.entry_point"
lmi_etc = "obstools.lmi_etc:LmiEtc.entry_point"
neocp_ephem = "obstools.neocp_ephem:NeocpEphem.entry_point"
scrub_deveny_pickup = "obstools.scrub_deveny_pickup:ScrubDevenyPickup.entry_point"

[tool.setuptools.packages.find]
include = ["obstools*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
obstools = ["config/README", "data/etc_filter_info.ecsv", "UI/*.ui", "UI/lowelllogo_horizontal_web.png"]
"obstools.tests" = ["files/deveny/*.fits", "files/deveny/focus/deveny_focus.*"]

[tool.setuptools_scm]
version_file = "obstools/version.py"

[tool.pytest.ini_options]
testpaths = ["obstools/tests"]
