# Generate release notes before tagging, then propose them through a PR to main.

name: "Update Changelog"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 0.7.6)
        required: true
        type: string

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must look like 0.7.6 or 0.8.0-beta.1 (without the v prefix)." >&2
            exit 1
          fi
          if git show-ref --tags --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "Tag v${RELEASE_VERSION} already exists; prepare the changelog before tagging." >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${RELEASE_VERSION}" -f target_commitish="$(git rev-parse HEAD)" \
            --jq .body > "$RUNNER_TEMP/release-notes.md"
          delimiter="release_notes_$(openssl rand -hex 16)"
          {
            echo "body<<${delimiter}"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36  # v1.12.0
        with:
          release-notes: ${{ steps.notes.outputs.body }}
          latest-version: Version ${{ inputs.version }}
          path-to-changelog: CHANGES.md

      - name: Propose updated changelog
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8
        with:
          add-paths: CHANGES.md
          base: main
          branch: changelog/v${{ inputs.version }}
          commit-message: Update changelog for v${{ inputs.version }}
          title: Update changelog for v${{ inputs.version }}
          body: Add the generated release notes to CHANGES.md before tagging.
          delete-branch: true
