# Propose release notes for the changelog through a pull request to main.

name: "Update Changelog"

on:
  release:
    types: [released]

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36  # v1.12.0
        with:
          release-notes: ${{ github.event.release.body }}
          latest-version: ${{ github.event.release.name }}
          path-to-changelog: CHANGES.md

      - name: Propose updated changelog
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8
        with:
          add-paths: CHANGES.md
          base: main
          branch: changelog/${{ github.event.release.tag_name }}
          commit-message: Update changelog for ${{ github.event.release.tag_name }}
          title: Update changelog for ${{ github.event.release.tag_name }}
          body: Add the published release notes to CHANGES.md.
          delete-branch: true
